name: Deploy to font.stavan.ai

# Runs when a CLOUDFLARE_API_TOKEN secret is set (Workers edit permission). Without it, deploy
# from a laptop with `npm run deploy`.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a Cloudflare token
        id: token
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "present=$([ -n "$CF" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.present == 'yes'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.token.outputs.present == 'yes'
        run: node test/layout.test.mjs && sh scripts/build-site.sh && npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: steps.token.outputs.present != 'yes'
        run: echo "No CLOUDFLARE_API_TOKEN secret, skipping deploy."
