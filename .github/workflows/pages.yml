name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (playground + font files)
        run: |
          mkdir -p _site/dist
          cp -r site/. _site/
          rm -rf _site/dist && mkdir -p _site/dist
          cp dist/*.ttf dist/*.woff dist/*.woff2 dist/stavan.css dist/notes-vs-font.png _site/dist/
          rm -f _site/write.mjs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
