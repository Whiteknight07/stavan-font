name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the fonts
        run: |
          mkdir -p Stavan && cp dist/*.ttf dist/*.woff dist/*.woff2 dist/*.svg dist/stavan.css OFL.txt Stavan/
          zip -r "Stavan-${GITHUB_REF_NAME}.zip" Stavan
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "Stavan-${GITHUB_REF_NAME}.zip" --clobber \
            || gh release create "$GITHUB_REF_NAME" "Stavan-${GITHUB_REF_NAME}.zip" --generate-notes
