name: A letter looks wrong
description: A character renders badly, sits too high or low, collides, or looks like a different letter.
labels: [glyph]
body:
  - type: input
    id: char
    attributes:
      label: Which character?
      placeholder: "e.g. k, or the third version of g"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What looks wrong?
      description: A screenshot helps a lot. If you can, say which app you typed it in.
    validations:
      required: true
